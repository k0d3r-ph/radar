name: radar

services:
  api:
    build: ./server
    command: ["npm", "run", "start:api"]
    env_file: ./server/.env
    environment:
      API_PORT: "5001"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/serviceAccountKey.json
      PROFILE_PHOTOS_DIR: /app/data/profile-photos
    volumes:
      - ./secrets/serviceAccountKey.json:/app/secrets/serviceAccountKey.json:ro
      - fotos:/app/data/profile-photos
    ports:
      - "127.0.0.1:5001:5001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot:
    build: ./server
    env_file: ./server/.env
    environment:
      PORT: "5000"
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/secrets/serviceAccountKey.json
      WWEBJS_AUTH_PATH: /app/.wwebjs_auth
    volumes:
      - ./secrets/serviceAccountKey.json:/app/secrets/serviceAccountKey.json:ro
      - whatsapp:/app/.wwebjs_auth
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  fotos:
  whatsapp:
